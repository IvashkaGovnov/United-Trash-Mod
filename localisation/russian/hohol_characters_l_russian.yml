 UKR_Viktor_Fedorovich_Yanukovych: "Янукович Виктор Фёдорович"
 UKR_Viktor_Fedorovich_Yanukovych_DESC: "Виктор Фёдорович Янукович — украинский политик, государственный деятель, Председатель Партии регионов, президент Украины с 1985 года. Родился в городе Енакиево (Донецкая область, СССР). Ранее занимал должности губернатора Донецкой области, премьер-министра Украины."
 
 
 
 