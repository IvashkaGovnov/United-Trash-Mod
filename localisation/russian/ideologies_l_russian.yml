l_russian:
 anorchism: "Анорхизм"
 anorchism_noun: "Анорхизм"
 anorchism_desc: "Безвластие"
 burjuism: "Буржуизм"
 burjuism_noun: "Буржуизм"
 burjuism_desc: "Власть под пятой капитала"
 borshewism: "Борщевизм"
 borshewism_noun: "Борщевизм"
 borshewism_desc: "Диктатура пролетариата"
 bidlo: "Быдлоизм"
 bidlo_noun: "Быдлоизм"
 bidlo_desc: "Диктатура быдла"
 pahanism: "Паханизм"
 pahanism_noun: "Паханизм"
 pahanism_desc: "Режим пахана"
 putinism: "Путинизм"
 putinism_noun: "Путинизм"
 putinism_desc: "Вечный путинский режим"
 
 anarcho_communism: "Анархо-коммунизм"
 anarcho_communism_desc: "«Нам нужно держаться вместе. Подальше от этих неуклюжих, грубых, толстокожих, несправедливых, равнодушных, истеричных и жестоких созданий»."
 anarcho_borshewism: "Анархо-борщевизм"
 anarcho_borshewism_desc: "«Если друг настоящий, то он не бросит. А если не настоящий, то и волноваться не о чем»."
 anarcho_bund: "Бунтарский анорхизм"
 anarcho_bund_desc: "«Кругом одни теоретики! А жизнь, это прежде всего — практика»."
 religious_anorchism: "Религиозный анорхизм"
 religious_anorchism_desc: "«Говорят, что у каждого есть свой ангел-хранитель. Я раньше не придавал этому особого значения. Интересно, какой он у меня? Жалко, что я его не вижу. Он-то обо мне знает всё! Всё, что я когда-то прятал и скрывал от других! Он всё видел!»"
 anarcho_nihilism: "Анархо-нигилизм"
 anarcho_nihilism_desc: "«А вдруг окажется, что смысл жизни — не есть сладкого и не спать до двенадцати? Я тогда только расстроюсь...»"
 philosophic_anorchism: "Философский анорхизм"
 philosophic_anorchism_desc: "«Иногда случается, что вещи теряют свой смысл. Вот смысл окна, например, чтобы в него смотреть. А порой смотришь в него, а смотреть там нечего. Ничего интересного. Или вот, какой смысл умываться по утрам? Чтобы быть бодрым? А какой смысл быть по утрам бодрым? Какой вообще смысл БЫТЬ по утрам? Непонятно. И непонятно, то ли жизнь всегда была бессмысленной, а ты просто не замечал этого, то ли смысл был, но куда-то затерялся»."
 anarcho_egoism: "Анархо-эгоизм"
 anarcho_egoism_desc: "«Я личность! Понятно? Бесформенная, но личность!»"
 post_leftism: "Постлевачество"
 post_leftism_desc: "«Барашик, мы создадим мир где каждый будет делать то, что хочет, там не будет никаких конфликтов! Мы оставим сценариста этого сериала без хлеба!»"
 anarcho_primitivism: "Анархо-примитивизм"
 anarcho_primitivism_desc: "«— Там такая замечательная травка была, а вы её уничтожили! Вы уничтожили целую среду обитания. Вот придут, например, бизоны, а травки-то и нет. Есть-то нечего!\n— Какие бизоны? Что ты придумываешь?\n— Здесь нет никаких бизонов.\n— Эх... Так потому их и нет, что есть нечего»."
 eco_anorchism: "Эко-анорхизм"
 eco_anorchism_desc: "«Это только кажется, что море большое. На самом деле оно маленькое, бесследно в нем ничего не исчезает»."
 techno_anorchism: "Техно-анорхизм"
 techno_anorchism_desc: "«Мы сделаем такой «Бац!», что прогресс полетит как ошпаренный! Только пятки засверкают!»"
 pirate_anorchism: "Пиратский анорхизм"
 pirate_anorchism_desc: "«— Быть моряком — это так потрясно! Плавать по морю, играть с дельфинами, кормить чаек!\n— А потом можно вернуться домой и попросить поэта нам описать всё это в книжке стального цвета!»"
 market_anorchism: "Рыночный анорхизм"
 market_anorchism_desc: "«Зная, что у меня кое-что припасено на чёрный день, я чувствую себя более спокойным»."
 national_anarchism: "Нацианал-анорхизм"
 national_anarchism_desc: "«Мы все живём в разных мирах»."
 antijapanism: "Антияпонизм"
 antijapanism_desc: "«— Послушайте, всё станет пылью, и воюющий с нею превратится в пыль.\n— Время подумать...\n— О вечном, но как всегда...\n— Надо разгребать этот мусор!»"
 terpila_anorchism: "Терпильный анорхизм"
 terpila_anorchism_desc: "«Похоже, это самая скучная битва добра со злом в истории»."
 analchism: "Аналхизм"
 analchism_desc: "«Нам нужно больше тратить сил на понимание друг друга, а не на попытки докричаться»."
 anarchism_bez_nikhuya: "Анархизм без нихуя"
 anarchism_bez_nikhuya_desc: "«Только отказавшись от всех амбиций, отпустив всё суетное и эгоистичное, можно познать суть мироздания»."
 
 liberakha: "Либерашкизм"
 liberakha_desc: "«А у тебя бывает когда-нибудь такое, что в голове мысли красивые, эффектные, бьющие без промаха, а когда начинаешь их говорить вслух, то получается какая-то белиберда несусветная?»"
 national_liberakha: "Нацианал-либерашкизм"
 national_liberakha_desc: "«Память есть неотъемлемая часть души. Душа — основополагающая часть пуха, то есть духа. А здравый дух, как вам известно, живёт в здоровом теле»."
 conserva: "Консервизм"
 conserva_desc: "«Вальсы, твисты, ламбады... Мода меняется. Но моё сердце бьётся только в ритме диско!»"
 american_dream: "Американская мечта"
 american_dream_desc: "«Для некоторых, заблуждения уютней истины»."
 atlantism: "Атлантизм"
 atlantism_desc: "«Эх, вот так всегда: когда ты готов спасти мир, на него никто не покушается»."
 social_dermocracy: "Социал-дерьмокрадия"
 social_dermocracy_desc: "«— Ну... И как ты с этим борешься?\n— Я пока только готовлюсь к борьбе»."
 sjw_system: "СЖВ-система"
 sjw_system_desc: "«Да у тебя ветер у самой в голове! Такой сквозняк, что если туда ветрогенератор поставить — то всю долину осветить можно будет! Ты... ты просто... гипертрофированная мансипама!»"
 greens: "Зелёная политика"
 greens_desc: "«— Это глобальное потепление. В Африке растают все айсберги и нас затопит.\n— Дорогая! В Африке нет айсбергов! Они в Арктике!\n— Ну конечно, в Арктике... Хотя Африке от этого только хуже»."
 zoomerism: "Зумеризм"
 zoomerism_desc: "«Дети, Копатыч, это тебе не лопухи! Они в мусоре не растут!»"
 onlyfansism: "Симпизм"
 onlyfansism_desc: "«Да, тогда у меня были рога не очень, но сейчас у меня рога хоть куда. Если бы она их сейчас увидела, она бы очень пожалела, что тогда поспешила с выводами!»"
 pedophilia: "Анархо-капитализм"
 pedophilia_desc: "«Надо Луну что ли в аренду сдать? А то висит как-то… без дела»."
 objectivism: "Объективизм"
 objectivism_desc: "«Что может быть важнее сокровищ?»"
 right_accelerationism: "Правый акселерационизм"
 right_accelerationism_desc: "«Когда ждёшь, секунды тянутся медленно, неохотно, как будто издеваются, и, когда ты наконец получаешь то, чего ждал, уже не получаешь от этого никакой радости. Вся наша жизнь — это сплошное ожидание. Мы ждём, когда закипит чайник или наступит вдохновение. Ждём новостей, своей очереди, подходящего момента. Летом — мы ждём зиму, а зимой — лето. Мы ждём свой день рождения, Новый год. Мы ждем, когда наступят выходные. Календарь и часы — самые ужасные изобретения в мире, но не будь их мы бы все равно чего-нибудь ждали»."
 demshiza: "Демшиза"
 demshiza_desc: "«То получаешь не совсем то, что хочешь; то получаешь, а уже не хочешь; а то и вовсе не знаешь, чего хочешь на самом деле»."
 
 mraxism: "Мраксизм"
 mraxism_desc: "«Не надо строить иллюзии, которые могут закончиться травмпунктом»."
 orthodox_borshewism: "Ортодоксальный борщевизм"
 orthodox_borshewism_desc: "«Ведь все беды от чего? От того, что каждый в одном и том же видит разное! Разные смыслы вкладывают, и получаются конфликты. А когда будет смысл один, настоящий, все будут жить дружно!»"
 gribonism: "Ленинизм"
 gribonism_desc: "«Ерунда! У всех всё одинаково»."
 left_avangardism: "Левый авангардизм"
 left_avangardism_desc: "«— Куда ты теперь, товарищ?!\n— Туда, где нет решеток и замков! Туда, где всегда сияет беспечное солнце свободы!»"
 vperedism: "Впередизм"
 vperedism_desc: "«— Вы бы меня ещё на луну отправили!\n— Бараш, что ж ты раньше всем не сказал? Покорение космоса – отличная идея!»"
 sralinism: "Сралинизм"
 sralinism_desc: "«Крош, если ты будешь со мной спорить, я тебя запишу»."
 samostiynost: "Самостийность"
 samostiynost_desc: "«Нюша, я почувствовал!... Я почувствовал, что у меня пропала вся посуда!»"
 trotskism: "Троцкизм"
 trotskism_desc: "«А ты уверен, что это твоё…? Что это твой, так сказать, стиль? Может, хотя бы в Мексику? Там кукурузы много…»"
 posadism: "Посадизм"
 posadism_desc: "«— Самый полезный опыт, это познать не свой характер, а характер своего друга!\n— И успеть сделать выводы.\n— И-Или ноги»."
 polpotism: "Полпотизм"
 polpotism_desc: "«— Если мы выживем, нам будет все нипочем!\n— А если нет?\n— Давайте о скучном сейчас думать не будем!»"
 borshewic_nationalism: "Борщевистский нацианализм"
 borshewic_nationalism_desc: "«Ты — раритет, я — раритет. Выходит, мы с тобой какая-то своеобразная коллекция…»" 
 monarcho_borshevism: "Монархо-борщевизм"
 monarcho_borshevism_desc: "«Поскольку все королевства уже расхватали, можно стать… принцессой цирка! Был бы только цирк…»"
 war_communism: "Военный коммунизм"
 war_communism_desc: "«Сейчас ты узнаешь, что такое — боевой кролик в действии!»"
 religious_borshewism: "Религиозный борщевизм"
 religious_borshewism_desc: "«Когда-нибудь все научатся находить равновесие между своими страстями и равнодушием. Обязательно научатся…»"
 left_dolbolsaviye: "Левое долбославие"
 left_dolbolsaviye_desc: "«— Меньше знаешь — крепче спишь!\n— В тебе говорит усталый дух! Ты стал старым, чёрствым и равнодушным!»" 
 sex_communism: "Секс-коммунизм"
 sex_communism_desc: "«В вопросах дружбы размер не имеет значения»."
 donat_borshewism: "Донатный борщевизм"
 donat_borshewism_desc: "«Ёлки-иголки, как мы только раньше этого не понимали? Вся наша жизнь это сплошные упущенные возможности»."
 alko_borshewism: "Алко-борщевизм"
 alko_borshewism_desc: "«Ну вот, погоревали, и хватит. Жизнь только начинается!»"
 dermokradic_borshewism: "Дерьмокрадский борщевизм"
 dermokradic_borshewism_desc: "«Друг мой, а вам не кажется, что мы оба остались при своём... Но при этом наелись мыла?»"
 utopianism: "Утопизм"
 utopianism_desc: "«Зачем нужна Вселенная, в которой нет чуда?»"
 nostalgic_borshewism: "Ностальгический борщевизм"
 nostalgic_borshewism_desc: "«Бывают вещи, с которыми очень трудно расстаться. Они уже такие старые, что их давно пора выбросить. Но к ним так привыкаешь, с ними связано столько историй, что кажется выбросить их все равно, что выбросить себя»."
 narodnichestvo: "Народничество"
 narodnichestvo_desc: "«Весна! Природа оживает. Всё вокруг начинает цвести. Но если природа вас кормит, то бывает, что некогда любоваться её красотами. Нужно пахать, удобрять, сеять, чтобы осенью собрать новый урожай и встретить зиму на сытый желудок»."
 tradeunionism: "Синдикализм"
 tradeunionism_desc: "«Что ни говори, сосед, а ремонт — дело коллективное!»"
 revolutionary_front: "Революционный фронт"
 revolutionary_front_desc: "«Тихо! Тихо! Хватит придираться друг к другу, нам всем здесь несладко! Если мы не перестанем ссориться, нам всем здесь каюк! Мы сможем выбраться отсюда только сообща!»"
 angsoc: "Английский социализм"
 angsoc_desc: "«— Неблагодарный! Мы же тебя спасаем от самого себя!\n— Так говорят все поработители!»"
 esoteric_borshewism: "Эзотерический борщевизм"
 esoteric_borshewism_desc: "«Чем больше всяких рецептов знаешь, тем правильнее живёшь. В них вся мудрость жизни»."
 gnostic_liberation: "Гностическое освобождение"
 gnostic_liberation_desc: "«Мне вот иногда кажется, что наш мир кем-то нарисован, и за нами всё время кто-то наблюдает. Вон оттуда»."
 
 nazbol: "Нацианал-борщевизм"
 nazbol_desc: "«И смотрите у меня – без лишних нежностей! Хоккей – это вам не бальные танцы!»"
 strasserism: "Штрассеризм"
 strasserism_desc: "«Да я больше овца, чем вы все вместе взятые!»" 
 grazhdane_sssr: "Граждане СССР"
 grazhdane_sssr_desc: "«Идеальное прошлое живёт только в нашей памяти»."
 right_dolboslaviye: "Правое долбославие"
 right_dolboslaviye_desc: "«Я вот тут подумал — если я единственный, кто знает правду, значит я единственный, кто сможет её доказать»."
 mrakobesiye: "Мракобесие"
 mrakobesiye_desc: "«Твоя наука — полная ерунда! Чего из-за неё волноваться? Если ты не откроешь какую-нибудь молекулу, её обязательно откроет кто-то другой»."
 occultism: "Оккультизм"
 occultism_desc: "«На улице ночь. Звёзды шлют свой свет из неведомых миров. Я чувствую, что не так уж и одинок в этом странном мире»."
 abdulovera: "Абдуловера"
 abdulovera_desc: "«Нельзя насильно заставить кого-то измениться, даже если он сам об этом просит. В конце концов, если ты созрел, то сможешь измениться и без посторонней помощи, сам»." 
 fashiki: "Фашизм"
 fashiki_desc: "«Зови меня «Хозяин» – не ошибёшься!»"
 nazi: "Нацизм"
 nazi_desc: "«Браво, друг мой, браво! Это признание — ваша победа! Это победа вашей воли над обстоятельствами!»"
 lmaoburgsis: "Эзотерический нацизм"
 lmaoburgsis_desc: "«Не знаю как у вас, а у нас уборка — целое приключение. Стоит только начать, и потом уже не остановиться»."
 toleratedictatorship: "Гомо-фашизм"
 toleratedictatorship_desc: "«Нет, Ёжик, дружить с девчонкой — это как есть немытую морковку, никогда не знаешь, что с тобой будет в следующий момент»."
 trap_fashiki: "Трап-фашизм"
 trap_fashiki_desc: "«Я просто выгляжу как лось, а в душе я бабочка!»"
 radical_feminism: "Радикальный феминизм"
 radical_feminism_desc: "«В этом доме есть мужчина, способный забить в стену гвоздь?!»"
 cute_monarchism: "Кьют-манярхизм"
 cute_monarchism_desc: "«Я девочка. Я не хочу ничего решать. Я хочу закрыть глаза, а когда открою, чтобы всё было хорошо!»"
 chornaya_sotnya: "Черносотенное движение"
 chornaya_sotnya_desc: "«Болезнь, как некоторых гостей, надо выводить в самом начале, когда они только пришли, а чемоданы ещё не распаковали, а то потом как поселятся, и уже не поймёшь, кто в доме хозяин»."
 national_burzhuism: "Нацианал-буржуизм"
 national_burzhuism_desc: "«— У нас, у греков, демократия.\n— Это греческое слово. Оно означает, что всё решает большинство.\n— Есть также замечательное греческое слово «тирания». Оно означает, что решает тот, кто больше всех грек»."
 altright: "Альт-райт"
 altright_desc: "«Все мы иногда чувствуем одиночество. Нам иногда не хватает собеседника, но это не значит, что мы одиноки на самом деле. Рядом с нами всегда есть тот, кто сможет понять наши переживания, выслушать нас, что-то подсказать. Как правило, одиночество и пустота вокруг нас — это плод нашего воображения. А на самом деле вокруг нас жизнь бьёт ключом, в ожидании когда мы вольёмся в её шумный и свежий поток»." 
 social_darwinism: "Социал-дарвинизм"
 social_darwinism_desc: "«— А ты, Крош, какой-то бесчувственный! Мог бы пожалеть такого малюточку!\n— А чего это я его должен жалеть? Я считаю, что каждый имеет право запутываться, где угодно и в чём хочет!»"
 senator_armstrong: "Взгляды сенатора Армстронга"
 senator_armstrong_desc: "«Отстаньте от меня. Вы мне надоели. Все ваши проблемки яйца выеденного не стоят! Вы даже не знаете, что такое настоящая проблема! Я вас ненавижу. Вы сделали меня таким же неврастеником, как и вы… Ну что, получили своё? Сейчас я вам такое скажу, такое!… Всё выскажу!…»"
 iron_dimon: "Взгляды Железного Димона"
 iron_dimon_desc: "«— Ну, сорняк, держись!\n— Ты сейчас нам за культуру ответишь!»" 
 eco_fashiki: "Эко-фашизм"
 eco_fashiki_desc: "«А зачем мне быть здоровым? Зачем мне вообще быть, если любая железяка может быть мною лучше, чем я!»" 
 gopniki: "Бандитизм"
 gopniki_desc: "«У меня такое ощущение, что у кого с совестью нет проблем, у того и с памятью все в порядке»." 
 ebengrad_system: "Ебеньградская система"
 ebengrad_system_desc: "«Ну-ка, дружненько поднажали! Голод - не тётка! Раз, два! Раз, два!»"
 illuminatism: "Иллюминатизм"
 illuminatism_desc: "«Тайное общество. Стёклышки и фантики. Ха-ха-ха. Ерунда какая!»"
 horde: "Коллективный разум"
 horde_desc: "«А вдруг наши чувства — это тоже неисправность, просто сбой в механизме, который можно починить? И тогда у всех будет… всё в порядке?…»"
 chris_chan_system: "Взгляды Крис-чана"
 chris_chan_system_desc: "«Ёжик! Спаси меня от самого себя!»"
 nuclear_destruction: "Ядерный аннигиляционизм"
 nuclear_destruction_desc: "«— Но ведь у нас нет технологий, чтобы контролировать ядерную реакцию! Мы не сможем таким образом получить энергию!\n— Эх... А я и не сказал, что мы будем её контролировать»."
 demiurgism: "Власть архонтов"
 demiurgism_desc: "«— Но ведь вокруг столько всего! Как… Как это ты так… Как это ты к мог… мог всё придумать?\n— Да не так уж много всего вокруг: наша долина, океан, пустыня, горы — особо напрягаться не пришлось. Ну плюс ещё девять персонажей, включая мой собственный физический образ — да и те довольно предсказуемые, что тоже не делает мне чести»."
 
 gachism: "Гачимучизм"
 gachism_desc: "«Если честно, то в жизни мне повезло лишь однажды, когда я встретил вас — моих друзей»." 
 flexism: "Флексизм"
 flexism_desc: "«Перед тем, как навсегда уйти из мира иллюзий, я хочу станцевать здесь свой последний танец»."
 radicalcentrism: "Радикальный центризм"
 radicalcentrism_desc: "«Будущего боятся существа, неуверенные в себе. Прошлого, наоборот, слишком самоуверенные. Настоящее так мимолётно, что его не успеваешь испугаться»."
 dumerism: "Думеризм"
 dumerism_desc: "«Бывают такие дни, когда ничего не вдохновляет. Всё кажется неинтересным, скучным, да просто раздражает. Хочется отменить все планы и встречи, просто сидеть дома и хандрить в своё удовольствие»."
 postironism: "Абсурдизм"
 postironism_desc: "«Мир – это выхухоль»."
 avangardism: "Авангардизм"
 avangardism_desc: "«Очень интересно, но пора заняться делом!»"
 typicalauthoritarism: "Диктатура"
 typicalauthoritarism_desc: "«О, друг мой наивный, если бы миром правили только те, кто это умеет!»"
 junta: "Хунта"
 junta_desc: "«Отставить разговоры! Всё нужно делать под команду командира! Раз, два, три! Полундра! Спасите! Помогите!»"
 mercs: "Наёмничество"
 mercs_desc: "«Герои не выжидают! Подвиг — это действие!»" 	
 occupation_regime: "Оккупационный режим"
 occupation_regime_desc: "«Иногда для принятия важного решения не хватает самой малости — хорошего пинка!»"
 manyarchism: "Манярхизм"
 manyarchism_desc: "«Солнце светит — хорошо, не светит — тоже хорошо, я сам себе солнце»."
 russian_traditions: "Русский традиционализм"
 russian_traditions_desc: "«Им не нужно просто! Ты пойми, у них и так всё просто! Им нужна сказка!»"
 verunstvo: "Верунство"
 verunstvo_desc: "«Нет! Земля не может быть круглой! Ты только представь: ни слонов, ни черепахи... один глупый шар, который болтается в космосе! Да не может быть! Потому что это НЕ ИНТЕРЕСНО!»"
 techodrochka: "Технодрочерство"
 techodrochka_desc: "«Глупый природа! Ты не сильнее, ты не мудрее. Ты — просто фи-зи-ка!»"
 tsardemocrasy: "Царьковая дерьмокрадия"
 tsardemocrasy_desc: "«Я вам помогу, ребята! Я буду командовать!»"
 longism: "Лонгизм"
 longism_desc: "«Не бойтесь! Всё будет в порядке! Мы обречены на успех!»"
 glongism: "Глонгизм"
 glongism_desc: "«Нет, со мной не всё в порядке. Не бывает, чтобы у кого-то всё было в порядке»." 
 anarchopunk: "Анархо-панк"
 anarchopunk_desc: "«Нет никакой справедливости! Для меня так это ясно, как простая гайка! Да, крушите всё — ничего не жалко, битте!»"
 anarcho_manyarchism: "Анархо-манярхизм"
 anarcho_manyarchism_desc: "«Как это здорово – быть принцессой, все ради тебя совершают подвиги, всякие героические поступки... Пойду-ка я тоже воодушевлю кого-нибудь на подвиги»."
 shueppsh: "ШУЕ-ППШ"
 shueppsh_desc: "«Ой, не спрашивай, всё равно не поймёшь. Нас, ун... уникумов... уникумей... ой... уй-уй, короче, личностей с необыкновенными способностями трудно понять. Мы же такие... необыкновенные!»"
 dvacherism: "Битардизм"
 dvacherism_desc: "«— Пин, где мы?…\n— Там, где только мы. Где нас не найдёт, хочешь того или нет, ни один аноним, обещаю»."
 trash_politics: "Трэш-политика"
 trash_politics_desc: "«С дубом мы обсуждаем серьёзные политические проблемы!»"
 razumism: "Разумизм"
 razumism_desc: "«Нельзя прятаться от жизни, дружище! Если так думать, то можно никогда не выйти из дома!»"
 
 imperial_putinism: "Имперский путинизм"
 imperial_putinism_desc: "«Когда я был маленьким, я верил, что вырасту и мне будут горы по плечу и море по колено, что я буду цельный и величественный, как скала! А что в итоге… Я — песчинка…»"
 colonial_putinism: "Колониальный путинизм"
 colonial_putinism_desc: "«Да что ж за жизнь такая? Мечты сбываются, а переварить ты их не можешь...»"
 eltsynism: "Ельцинизм"
 eltsynism_desc: "«Очень трудно жить, думая о каждой ошибке, которую ты совершил, поэтому всё плохое забываешь, а помнишь только хорошее — очень удобно, но от себя не уйдёшь»."
 plastic_putinism: "Пластиковый путинизм"
 plastic_putinism_desc: "«Никаких больше волнений, никаких катастроф и сенсаций! Спокойные и скучные заголовки. Заголовки, которые не кричат, а нежно-нежно шепчут…»"
 oligarhiya: "Олигархия"
 oligarhiya_desc: "«Мне теперь всегда будет хорошо. Теперь у меня будет столько шоколада, сколько мне надо. Пять! Нет, десять! Нет, сто! Нет, столько, сколько можно! У меня теперь всё будет из шоколада: стол из шоколада и стул из шоколада! Хочется вкусненького — бац, съела стол! Я даже дом из шоколада сделаю! Весь мир будет из шоколада, весь мир!»"
 prikhvatocracy: "Прихватократия"
 prikhvatocracy_desc: "«— Ёжик, если бы тебе предложили на выбор: немного морковки или хорошее настроение на оставшееся лето, ты бы что выбрал?\n— Конечно, хорошее настроение!\n— Так и запишем: Ёжик отказался от своей части урожая морковки… А если бы предложили немного яблочек или…\n— Яблочек! И много»."
 esoteric_putinism: "Эзотерический путинизм"
 esoteric_putinism_desc: "«Бывают такие дни, когда весь мир лежит перед тобой, как вкусное пирожное. Всё становится ясно и понятно. Никаких тайн и загадок. И это чувство всезнания переполняет словно, словно... И нужно общение, общение... Потому что, если ты всю эту мудрость кому-нибудь немедленно не расскажешь, то можно просто умолкнуть!»"
 atomic_orthodoxy: "Атомное православие"
 atomic_orthodoxy_desc: "«Ты можешь быть добрым и наивным, потому что есть тот, кто охраняет твой сон»."
 japanese_putinism: "Японский путинизм"
 japanese_putinism_desc: "«Как говорят японцы, никто не спотыкается, лёжа в постели. Сейчас или никогда!»"
 western_putinism: "Западный путинизм"
 western_putinism_desc: "«Ты же знаешь, мы постоянно меняемся... И очень важно помнить, что ты был положительным персонажем...»"
 duginism: "Четвёртая политическая теория"
 duginism_desc: "«Ничего не понимаю, но, похоже, нас ожидает что-то эпическое»."
 left_putinism: "Красный путинизм"
 left_putinism_desc: "«— Ну вы и фрукты!\n— На самом деле, он уже почти овощ»."
 securocracy: "Секьюрократия"
 securocracy_desc: "«— Лучшего места для засады не найти!\n— Я против! Надо разобраться.\n— Вот и я про то же. Поймаем — разберемся»."
 roskomnadzor: "Система Роскомнадзора"
 roskomnadzor_desc: "«У кого чистая совесть — тому скрывать нечего! Показывай!»"
 morgenshterism: "Моргенштеризм"
 morgenshterism_desc: "«Неужели трудно понять? Я выражался фигурально, то есть говорил не то, что думал!»"
 
 
