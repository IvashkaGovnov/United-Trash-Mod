l_russian:
 PRODUCTION_MATERIALS_ORDINARY_COMPONENTS:0 "Простые материалы"
 ordinary_components_desc:1 "Базовые природные или первично обработанные материалы, составляющие основу любой производственной деятельности. Наиболее доступный тип ресурсов на Земном диске и за его пределами. Используются как в строительстве, так и в изготовлении различных припасов первичной необходимости."
 PRODUCTION_MATERIALS_LIGHT_METALS:0 "Лёгкие металлы"
 light_metals_desc:0 "Распространённые металлические материалы, добываемые в массе своей из подземных месторождений. Алюминий, магний и другие лёгкие металлы отличаются сравнительно небольшой массой, высокой технологичностью и широкими возможностями обработки. Незаменимы при производстве стрелкового оружия, боеприпасов и иного оборудования."
 PRODUCTION_MATERIALS_HARD_METALS:0 "Редкоземельные металлы"
 hard_metals_desc:0 "Ценные металлические элементы, добыча и переработка которых требуют специализированного оборудования и сложных промышленных процессов. Вольфрам, молибден, кобальт, редкоземельные элементы и другие стратегические материалы обладают особыми физическими и химическими свойствами. Применяются в производстве высокоточного вооружения, бронетехники, специальных сплавов и электронных компонентов."
 PRODUCTION_MATERIALS_ALLOYS:0 "Сплавы"
 alloys_desc:0 "Металлургическая продукция повышенной сложности, получаемая путём соединения различных металлов и легирующих компонентов. Производство требует значительных затрат, квалифицированного труда и развитой промышленной инфраструктуры. Сплавы обладают улучшенными прочностными, термическими и эксплуатационными характеристиками и необходимы для изготовления тяжёлой военной техники, бронезащиты, двигателей, кораблей и авиационных конструкций."
 PRODUCTION_MATERIALS_BIOMATERIALS_AND_FOOD:0 "Биоматериалы"
 biomaterials_and_food_desc:0 "Материалы органического происхождения, получаемые из сельскохозяйственного сырья, растительных и животных ресурсов. Включают продовольствие, растительные волокна, жиры, белковые соединения, натуральные ткани и другие биологические компоненты. Служат основой продовольственного обеспечения населения, производства армейских пайков, медикаментов, текстиля и различных товаров повседневного потребления."
 PRODUCTION_MATERIALS_SYNTHETICS:0 "Синтетические материалы"
 synthetics_desc:0 "Искусственно созданные вещества, получаемые посредством химической переработки природного сырья. К ним относятся синтетические волокна, пластмассы, искусственная резина и различные композитные соединения. Широко применяются в производстве военной формы, защитного снаряжения и колёс для транспортных средств."
 PRODUCTION_MATERIALS_CHEMICALS:0 "Этанол"
 chemicals_desc:0 "Основной компонент жидкого моторного топлива, заменивший традиционные нефтепродукты в энергетике и транспортной инфраструктуре. Производится преимущественно путём промышленной переработки биологического сырья и сельскохозяйственной продукции, а также посредством специализированных химических процессов. Используется для заправки двигателей сухопутной, воздушной и морской техники, военного транспорта, авиации и других машин."
 PRODUCTION_MATERIALS_SUPERCONDUCTORS:0 "Сверхпроводники"
 superconductors_desc:0 "Высокотехнологичные материалы с уникальными электрическими свойствами, позволяющие передавать электрический ток с минимальными потерями энергии при определённых условиях. Их производство требует высокочистого сырья, сложных технологических процессов и специализированного оборудования. Незаменимы при создании мощных электромагнитных систем, высокоточных приборов, передовых энергетических установок, вычислительных комплексов и экспериментального вооружения."
 PRODUCTION_MATERIALS_MICROELECTRONICS:0 "Микроэлектроника"
 microelectronics_desc:0 "Высокоточные электронные компоненты, предназначенные для обработки, хранения и передачи информации, а также управления сложными техническими системами. Включают микросхемы, полупроводниковые элементы, процессоры, датчики и интегральные схемы. Являются необходимой основой современной вычислительной техники, систем связи, радиолокации, автоматизированного управления, робототехники и высокотехнологичного вооружения."
 PRODUCTION_MATERIALS_NEUROPOLYMERS:0 "Нейрополимеры"
 neuropolymers_desc:0 "Особая группа синтетических и органоминеральных веществ желеобразной формы, обладающих необычными структурными и функциональными свойствами. Способны взаимодействовать с электрическими, биологическими и предполагаемыми ноосферными явлениями с помощью процесса мимикрической адаптации, сохраняя устойчивость в условиях, недоступных традиционным материалам. Представляют значительный интерес для передовых научных исследований, гражданской промышленности и робототехники."
 PRODUCTION_MATERIALS_ENERGY_MODULES:0 "Энергомодули"
 energy_modules_desc:0 "Исключительно сложные технологические устройства, предназначенные для генерации, преобразования и стабилизации энергии в компактных системах. Сочетают передовые инженерные решения с использованием редких материалов и экспериментальных физических принципов. Являются ключевыми компонентами инновационных изобретений, автономных энергетических установок, высокотехнологичных машин и экспериментальных устройств."
 PRODUCTION_MATERIALS_NEURO_MODULES:0 "Нейромодули"
 neuro_modules_desc:0 "Сложнейшие вычислительные и управляющие комплексы, предназначенные для обработки информации, принятия решений и координации работы автономных систем. Могут сочетать традиционные вычислительные технологии с биологическими, нейронными и экспериментальными принципами организации сознания. Необходимы для создания интеллектуальных машин, автономных механизмов, искинов и инновационных устройств, функционирующих за пределами возможностей обычной электроники."
 PRODUCTION_MATERIALS_NOOACTIVE_MATERIALS:0 "Нооактивные конструкционные материалы"
 nooactive_materials_desc:0 "Экспериментальные материалы, способные взаимодействовать с ноосферными полями и изменять свои физические характеристики под воздействием информационных, психических и иных нетрадиционных факторов. Обладают уникальными структурными свойствами, позволяющими использовать их в качестве основы специализированных приборов, защитных конструкций и сложного оборудования. Представляют собой важнейший компонент прикладной оккультно-эзотерической тавматургии, исследований ноосферы и технологий воздействия на нематериальные процессы."
 PRODUCTION_MATERIALS_ENERGETICS:0 "Энергетика"
 energetics_desc:0 "Электрический ток, получаемый посредством преобразования природных и искусственных источников энергии. Производится на тепловых, гидроэлектрических, атомных и других специализированных электростанциях. Является основой функционирования современной промышленности, инфраструктуры и технологических комплексов."
 PRODUCTION_MATERIAL_VAL:0 "$VALUE|0H$"
 
