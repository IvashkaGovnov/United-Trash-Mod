 SOUZ_NAME: "Пост-Союз:"
 SOUZ_DESC: "Минули годы с момента краха Союза Советских Социалистических Республик. Лихие, скорбные, смутные времена настали для всех народов некогда могучей страны. Союзное государство идёт к консолидации Прибалтики и Беларуси, русские националисты спешат восстановить былую славу, различные окраины впали в пучину гражданских войн, коммунистические элементы готовятся к реваншу за все свои предыдущие поражения, а в Сибири огромное революционное братство готовится к последнему и решительному бою с реакционерами. Словно иней, сердобольный смех валится на РУССКОЕ ПОЛЕ ЭКСПЕРИМЕНТОВ."
