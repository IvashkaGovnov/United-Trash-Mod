 UKR_DESC: "Незалежная Республика Украина. \n\nТак кричала о своей незалежности по всем углам нашей круглой земли, что так и вписали во всех документах мира.: «Незалежная, объявляет о своей независимости от СССР, и становится на путь самоопределения». \n\nЕстественно на государственной мове там мнооого что сказано, я постарался передать суть."
 